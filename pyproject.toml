[project]
name = "zelig-puppet-warp"
version = "0.4.0"  # dynamically loaded in setup.py from version.py, this is fallback
description = "Puppet Warp, as maintained by Zelig."
readme = "README.rst"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [    
    "numpy>=1.24.0",
    "opencv-contrib-python-headless>=4.7.0.72,<=4.11.0.86",
    "scikit-image>=0.20.0,<=0.25.1",
    "scikit-learn>=1.1.3,<=1.6.1",
]

authors = [
  { name = "Michal Cokina", email = "mikecokina@gmail.com" },
  { name = "Zelig Engineering", email = "engineering@zelig.com" },
]

[project.optional-dependencies]
dev = [
    "parameterized>=0.8.1",
    "pre-commit==4.5.1",
    "pylint==3.3.9",
    "pylint-actions==0.6.0",
    "pytest==9.0.2",
    "pytest-github-actions-annotate-failures==0.4.0",
    "ruff==0.15.6",
]
jrs = ["triangle @ git+https://github.com/drufat/triangle.git"]

[project.urls]
Homepage = "https://github.com/wearezelig/puppet-warp"
Repository = "https://github.com/wearezelig/puppet-warp"
Original_Homepage = "https://github.com/mikecokina/puppet-warp"
Original_Repository = "https://github.com/mikecokina/puppet-warp"


[tool.setuptools.package-data]
"pwarp" = ["conf/logging_schemas/default.json"]
